name: mybirthday_app
description: "BirthDay OS — философский life dashboard с обратным отсчётом до дня рождения"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Animations
  flutter_animate: ^4.5.2

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Typography
  google_fonts: ^6.2.1

  # SVG
  flutter_svg: ^2.0.17

  # Confetti
  confetti: ^0.8.0

  # Date formatting
  intl: ^0.20.2

  # Local storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # JSON serialization
  json_annotation: ^4.9.0
  home_widget: ^0.9.3
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#06060F"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  android_12:
    color: "#06060F"
    image: assets/icon/splash_logo.png
